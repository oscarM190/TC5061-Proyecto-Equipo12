name: MiBici API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-api-dev.txt
      - run: python -m pip install -r requirements-api-dev.txt
      - run: python -m pytest serving/tests -v
        env:
          MLFLOW_ENABLE_TELEMETRY: 'false'
          MLFLOW_DISABLE_AGENT_HINT: '1'
