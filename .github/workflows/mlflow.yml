name: MiBici CI/CD

on: 
  push:
    branches:
      - main

jobs:
  train:
    runs-on: ubuntu:latest

    steps:
      - name: checkout code
        uses: actions/checkout@v2

      - name: Set up python
        uses: actions/setup-python@v2
        with:
          python-version: "3.14.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
