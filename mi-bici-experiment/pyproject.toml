[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mi_bici_experiment"
version = "0.0.1"
description = "Creacion de modelos para reponder preguntas de negocio"
authors = [
  { name = "equipo12" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.14,<3.15"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["mi_bici_experiment"]
force_sort_within_sections = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
